name: ci

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet test tests/DevDigest.Tests