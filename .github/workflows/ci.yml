name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The pipelines come from Megjafari/platform-pipelines, pinned to the v1 release line
jobs:
  lint:
    uses: Megjafari/platform-pipelines/.github/workflows/reusable-lint.yml@v1
    permissions:
      contents: read

  dotnet:
    uses: Megjafari/platform-pipelines/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      dotnet-version: "10.0.x"
