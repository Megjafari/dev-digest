name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    uses: Megjafari/platform-pipelines/.github/workflows/reusable-codeql.yml@v1
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    with:
      # "actions" also scans this repository's own workflows
      languages: '["csharp", "actions"]'
