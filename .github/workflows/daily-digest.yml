name: daily-digest

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, ungefar 08:00 svensk sommartid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run digest
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: dotnet run --project src/DevDigest

      - name: Commit digest
        env:
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          git config user.name "Megjafari"
          git config user.email "$COMMIT_EMAIL"
          git add digests
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "digest: $(date -u +%F)"
            git push
          fi