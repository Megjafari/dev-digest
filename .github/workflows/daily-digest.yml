name: daily-digest

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, about 08:00 Swedish summer time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The seen list lives in the Actions cache instead of the repository, so nothing is committed
      - name: Restore seen list
        uses: actions/cache/restore@v4
        with:
          path: digests/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Run digest
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: dotnet run --project src/DevDigest

      - name: Save seen list
        uses: actions/cache/save@v4
        with:
          path: digests/seen.json
          key: seen-${{ github.run_id }}
