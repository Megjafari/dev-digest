name: daily-digest

on:
  # GitHub often starts scheduled runs hours late, and the top of the hour is the busiest time.
  # So start early, at odd minutes, with backups. The first run that starts sends the digest;
  # later ones the same day see last-sent.txt and stop. 02:23 UTC is 03:23 in Swedish winter time.
  schedule:
    - cron: "23 2 * * *"
    - cron: "47 2 * * *"
    - cron: "13 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A manual run and the schedule must not overlap, or both would start from the same seen list
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The seen list lives in the Actions cache instead of the repository, so nothing is committed
      - name: Restore seen list
        uses: actions/cache/restore@v4
        with:
          path: digests/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Restore last sent date
        uses: actions/cache/restore@v4
        with:
          path: digests/last-sent.txt
          key: last-sent-${{ github.run_id }}
          restore-keys: last-sent-

      - name: Run digest
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: dotnet run --project src/DevDigest

      - name: Save seen list
        uses: actions/cache/save@v4
        with:
          path: digests/seen.json
          key: seen-${{ github.run_id }}

      - name: Save last sent date
        uses: actions/cache/save@v4
        with:
          path: digests/last-sent.txt
          key: last-sent-${{ github.run_id }}
